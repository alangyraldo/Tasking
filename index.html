<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasking | Planificador de tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container-xl py-4">

    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 fw-medium mb-0">Tasking</h1>
        <p class="text-body-secondary mb-0">Planificador de tareas</p>
      </div>
      <button type="button" class="btn btn-cancelar rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalTarea">
        + Nueva tarea
      </button>
    </header>

<!-- esta es la seccion del tablero tipo trelo-->
    <section class="row g-3" aria-label="Tablero de tareas">

      <div class="col-md-4">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3"><span></span> Por hacer <span class="conteo">0</span></h2>

        </div>
      </div>

      <div class="col-md-4">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3"><span></span> En progreso <span class="conteo">0</span></h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3"><span></span> Hecho <span class="conteo">0</span></h2>
        </div>
      </div>

    </section>
  </main>

  
  <div class="modal fade" id="modalTarea" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" action="#" method="post">

        <div class="modal-header border-0">
          <h2 class="modal-title h5 fw-medium" id="tituloModal">Nueva tarea</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
          </div>

          <div class="mb-3">
            <label for="asignadoA" class="form-label">Asignado a</label>
            <input type="text" class="form-control" id="asignadoA" name="asignadoA" required>
          </div>

          <div class="mb-3">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input type="date" class="form-control" id="fechaEntrega" name="fechaEntrega" required>
          </div>

          <div>
            <label for="estado" class="form-label">Estado</label>
            <select class="form-select" id="estado" name="estado" required>
              <option value="por-hacer">Por hacer</option>
              <option value="en-progreso">En progreso</option>
              <option value="hecho">Hecho</option>
            </select>
          </div>
        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn btn-cancelar rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-guardar rounded-pill px-4">Guardar tarea</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
