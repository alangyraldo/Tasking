<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasking | Planificador de tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container-xl py-4">

    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 fw-medium mb-0">Tasking</h1>
        <p class="text-body-secondary mb-0">Planificador de tareas</p>
      </div>
      <button type="button" class="btn btn-cancelar rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalTarea">
        + Nueva tarea
      </button>
    </header>
  
  
  
    <!-- tblero tipo trello -->
    <section class="row g-3" aria-label="Tablero de tareas" id="task-container">

      <div class="col-md-6 col-lg-3">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3">Por hacer <span class="conteo" data-estado="POR HACER">0</span></h2>
          <div class="lista-tareas d-grid gap-2" data-estado="POR HACER"></div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3">En proceso <span class="conteo" data-estado="EN PROCESO">0</span></h2>
          <div class="lista-tareas d-grid gap-2" data-estado="EN PROCESO"></div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3">Revisión <span class="conteo" data-estado="REVISIÓN">0</span></h2>
          <div class="lista-tareas d-grid gap-2" data-estado="REVISIÓN"></div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="columna p-3 h-100">
          <h2 class="h6 fw-medium mb-3">Hecho <span class="conteo" data-estado="HECHO">0</span></h2>
          <div class="lista-tareas d-grid gap-2" data-estado="HECHO"></div>
        </div>
      </div>

    </section>
  </main>

  <div class="modal fade" id="modalTarea" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="task-form" novalidate>

        <div class="modal-header border-0">
          <h2 class="modal-title h5 fw-medium" id="tituloModal">Nueva tarea</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">

          <div id="form-errors" class="alert alert-danger d-none" role="alert"></div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Mínimo 9 caracteres">
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Mínimo 16 caracteres"></textarea>
          </div>

          <div class="mb-3">
            <label for="asignadoA" class="form-label">Asignado a</label>
            <input type="text" class="form-control" id="asignadoA" name="asignadoA" placeholder="Mínimo 9 caracteres">
          </div>

          <div class="mb-3">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input type="date" class="form-control" id="fechaEntrega" name="fechaEntrega">
          </div>

          <div>
            <label for="estado" class="form-label">Estado</label>
            <select class="form-select" id="estado" name="estado">
              <option value="">Selecciona un estado</option>
              <option value="POR HACER">Por hacer</option>
              <option value="EN PROCESO">En proceso</option>
              <option value="REVISIÓN">Revisión</option>
              <option value="HECHO">Hecho</option>
            </select>
          </div>
        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn btn-cancelar rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-guardar rounded-pill px-4">Guardar tarea</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
